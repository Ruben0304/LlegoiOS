query Me($jwt: String!) {
  me(jwt: $jwt) {
    id
    name
    email
    username
    phone
    role
    createdAt
    providerUserId
    avatar
    avatarUrl
    savedAddresses {
      id
      label
      street
      city
      reference
      addressType
      buildingName
      floor
      apartment
      deliveryInstructions
      latitude
      longitude
    }
    defaultAddressId
    scheduledDeletionAt
  }
}
