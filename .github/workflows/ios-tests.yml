name: iOS build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Choose an available iPhone simulator
        id: simulator
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone")))')
          echo "id=$device" >> "$GITHUB_OUTPUT"
      - name: Build and test with an isolated app environment
        run: >-
          xcodebuild test -project LlegoiOS.xcodeproj -scheme LlegoiOS
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/LlegoiOS.xcresult"
          CODE_SIGNING_ALLOWED=NO
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/LlegoiOS.xcresult
          if-no-files-found: ignore
